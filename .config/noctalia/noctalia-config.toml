[bar.default]
center = [ "clock", "weather" ]
concave_edge_corners = false
end = [
    "media",
    "spacer_2",
    "tray",
    "notifications",
    "clipboard",
    "cpu",
    "temp",
    "ram",
    "spacer_4",
    "network",
    "spacer_3",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "session"
]
start = [ "launcher", "wallpaper", "control-center", "workspaces", "active_window" ]

[dock]
active_monitor_only = true

[location]
address = "Izhevsk"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1", "lockscreen-login-box@DP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 1280.0
    cy = 1258.0
    output = "DP-1"
    placement_height = 1440.0
    placement_width = 2560.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell]
avatar_path = "/home/insomnium/Pictures/loki.jpg"

[theme]
builtin = "Noctalia"
community_palette = "Oxocarbon"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

[wallpaper]
directory = "/home/insomnium/Pictures/walls"

    [wallpaper.automation]
    enabled = true
    interval_seconds = 30
    order = "alphabetical"

    [wallpaper.default]
    path = "/home/insomnium/Pictures/walls/wallhaven-7py28o.jpg"

    [wallpaper.last]
    path = "/home/insomnium/Pictures/walls/wallhaven-7py28o.jpg"

    [wallpaper.monitors.DP-1]
    path = "/home/insomnium/Pictures/walls/wallhaven-7py28o.jpg"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/insomnium/Pictures/walls/wallhaven-7py28o.jpg"

[widget.spacer_2]
type = "spacer"

[widget.spacer_3]
type = "spacer"

[widget.spacer_4]
type = "spacer"
